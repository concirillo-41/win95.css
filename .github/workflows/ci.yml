name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: dist/ matches the source
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run npm run build and commit the result."
            git diff --stat -- dist
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - name: Walk the demo at desktop and phone sizes
        run: npm run check
